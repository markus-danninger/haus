<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#24292e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Haus">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="icon-192.png">
  <title>Haus</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1f1f1f; }
    html, body { margin: 0; height: 100%; background: #24292e; }
    body { display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
    form { background: #f5f3ef; border-radius: 12px; padding: 28px 24px 22px; width: 100%; max-width: 340px; box-sizing: border-box; }
    img { display: block; width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 14px; }
    h1 { font-size: 20px; margin: 0 0 18px; text-align: center; }
    input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 11px 12px; border: 1px solid #dedad3; border-radius: 8px; background: #fff; }
    button { width: 100%; margin-top: 12px; font-size: 16px; font-weight: 600; padding: 11px; border: 0; border-radius: 8px; background: #2f5d7c; color: #fff; cursor: pointer; }
    button:disabled { opacity: .6; }
    p { font-size: 13px; color: #6b6b6b; margin: 12px 0 0; min-height: 1.3em; text-align: center; }
    p.fehler { color: #c62828; }
    .unsichtbar { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    form[hidden] { display: none; }
  </style>
</head>
<body>
  <form id="login" hidden autocomplete="on">
    <img src="icon-192.png" alt="">
    <h1>Haus</h1>
    <input class="unsichtbar" type="text" name="username" autocomplete="username" value="haus" tabindex="-1" aria-hidden="true">
    <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Passwort" required autofocus>
    <button id="los">Öffnen</button>
    <p id="msg"></p>
  </form>
  <script>
    // Anmeldung der Handy-Version: Passwort -> Schlüssel (PBKDF2), Probe am Inhaltsverzeichnis, Schlüssel ablegen.
    // Den Rest (Entschlüsseln, Offline-Speicher) macht sw.js.
    const $ = (s) => document.querySelector(s);
    const kannSW = 'serviceWorker' in navigator && 'caches' in window;
    // Schlüssel als rohe Bytes in IndexedDB und im Cache Storage; beides liest auch der Service Worker (siehe sw.js)
    const SCHLUESSEL = 'schluessel', SCHLUESSEL_URL = 'schluessel.bin';
    const frist = (ms, p) => Promise.race([p, new Promise((_, f) => setTimeout(() => f(new Error('Zeit')), ms))]);
    function db() {
      return new Promise((ok, fehler) => {
        const r = indexedDB.open('haus', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('k');
        r.onsuccess = () => ok(r.result); r.onerror = () => fehler(r.error);
      });
    }
    async function idb(modus, f) {
      const d = await frist(3000, db());
      return new Promise((ok, fehler) => { const t = d.transaction('k', modus), r = f(t.objectStore('k')); t.oncomplete = () => ok(r?.result); t.onerror = () => fehler(t.error); });
    }
    async function hatSchluessel() {
      if (await idb('readonly', (s) => s.get('roh')).catch(() => null)) return true;
      return frist(3000, caches.open(SCHLUESSEL).then((c) => c.match(SCHLUESSEL_URL))).then(Boolean).catch(() => false);
    }
    async function schluesselSpeichern(roh) {
      const a = await idb('readwrite', (s) => { s.put(roh, 'roh'); s.delete('schluessel'); }).then(() => true, () => false);
      const b = await caches.open(SCHLUESSEL).then((c) => c.put(SCHLUESSEL_URL, new Response(roh))).then(() => true, () => false);
      if (!a && !b) throw new Error('Speichern');
    }

    function meldung(text, fehler) { $('#msg').textContent = text; $('#msg').className = fehler ? 'fehler' : ''; }
    function formular(text, fehler) { $('#login').hidden = false; $('#los').disabled = false; meldung(text || '', fehler); $('#pw').focus(); }

    async function zurApp() {
      try { await frist(15000, navigator.serviceWorker.ready); } catch {
        formular('Der Offline-Speicher startet nicht. Seite neu laden; hilft das nicht, die Adresse mit ?reset am Ende öffnen.', true); return;
      }
      sessionStorage.setItem('weiter', Date.now());
      location.replace('app/');
    }

    // ?reset: alles Gespeicherte dieser Seite löschen (Offline-Speicher, Schlüssel) und neu anfangen
    async function zuruecksetzen() {
      $('#login').hidden = false; meldung('Setze zurück …');
      for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
      for (const k of await caches.keys()) await caches.delete(k);
      await new Promise((ok) => { const r = indexedDB.deleteDatabase('haus'); r.onsuccess = r.onerror = r.onblocked = ok; setTimeout(ok, 2000); });
      sessionStorage.clear();
      location.replace('./');
    }

    (async () => {
      const q = new URLSearchParams(location.search);
      if (!kannSW) { formular('Dieser Browser kann die App nicht laden (privates Fenster?).', true); $('#los').disabled = true; return; }
      if (q.has('reset')) { await zuruecksetzen(); return; }
      navigator.serviceWorker.register('sw.js');
      idb('readwrite', (s) => s.delete('schluessel')).catch(() => null);   // CryptoKey der ersten Version
      if (location.search) history.replaceState(null, '', './');
      // Schleifensperre: kommt die Seite binnen 8 s nach einer Weiterleitung zur App wieder hierher zurück, wird nicht
      // noch einmal weitergeleitet. ?anmelden schickt der Offline-Speicher, wenn ihm der Schlüssel fehlt (Fehler A);
      // ?fehlt schickt 404.html, wenn die App am Offline-Speicher vorbei geladen wurde (Fehler B).
      const zurueck = Date.now() - (+sessionStorage.getItem('weiter') || 0) < 8000;
      sessionStorage.removeItem('weiter');
      if (zurueck && q.has('anmelden') && await hatSchluessel()) { formular('Fehler A: Der Offline-Speicher findet den Schlüssel nicht. Bitte an Claude schicken.', true); return; }
      if (zurueck && q.has('fehlt')) { formular('Fehler B: Safari lädt die App am Offline-Speicher vorbei. Bitte an Claude schicken.', true); return; }
      if (zurueck) { formular('Bitte noch einmal anmelden.'); return; }
      if (!q.has('anmelden') && await hatSchluessel()) { zurApp(); return; }
      formular();
    })();

    $('#login').onsubmit = async (e) => {
      e.preventDefault();
      $('#los').disabled = true; meldung('Prüfe …');
      let meta, bin;
      try {
        [meta, bin] = await Promise.all([
          fetch('meta.json', { cache: 'no-cache' }).then((r) => r.json()),
          fetch('inhalt.bin', { cache: 'no-cache' }).then((r) => r.arrayBuffer()),
        ]);
      } catch { formular('Keine Verbindung. Für die erste Anmeldung braucht es Internet.', true); return; }
      const pw = await crypto.subtle.importKey('raw', new TextEncoder().encode($('#pw').value), 'PBKDF2', false, ['deriveBits']);
      const salz = Uint8Array.from(atob(meta.salz), (c) => c.charCodeAt(0));
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salz, iterations: meta.iterationen }, pw, 512);
      const roh = new Uint8Array(bits.slice(0, 32));
      const key = await crypto.subtle.importKey('raw', roh, 'AES-GCM', false, ['decrypt']);
      try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bin.slice(0, 12) }, key, bin.slice(12)); } catch {
        formular('Passwort stimmt nicht.', true); $('#pw').select(); return;
      }
      try { await schluesselSpeichern(roh); } catch { formular('Der Browser lässt nichts speichern (privates Fenster oder voller Speicher?).', true); return; }
      meldung('Öffne …');
      await zurApp();
    };
  </script>
</body>
</html>
